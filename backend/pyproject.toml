[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra"
version = "0.1.0"
description = "Remote supervisor prototype for local coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiogram>=3.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
sutra = "sutra.__main__:main"
